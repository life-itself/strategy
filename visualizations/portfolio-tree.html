<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; }
  #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; }

  .panel {
    position: absolute; background: white; border: 1px solid #ddd;
    border-radius: 8px; padding: 12px 16px; font-size: 13px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .legend { top: 16px; left: 16px; }
  .legend h3 { font-size: 15px; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend .hint { margin-top: 8px; font-size: 11px; color: #888; line-height: 1.5; }

  .tooltip {
    position: absolute; background: white; border: 1px solid #ccc;
    border-radius: 6px; padding: 10px 14px; font-size: 13px;
    max-width: 320px; pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: none; z-index: 10;
  }
  .tooltip h4 { margin-bottom: 2px; }
  .tooltip .badge {
    display: inline-block; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 1px 6px; border-radius: 3px;
    color: white; margin-bottom: 4px;
  }
  .tooltip .desc { margin-top: 4px; color: #444; }
  .tooltip .meta { margin-top: 6px; color: #666; font-size: 11px; }

  .node text { font-size: 12px; fill: #333; }
  .node circle { stroke: #fff; stroke-width: 2; cursor: pointer; }
  .link { fill: none; stroke: #ccc; stroke-width: 1.5; }

  .controls { top: 16px; right: 16px; }
  .controls label { display: block; margin: 3px 0; cursor: pointer; }
</style>
</head>
<body>
<div id="container">
  <svg></svg>

  <div class="panel legend">
    <h3>Portfolio Tree</h3>
    <div class="legend-item"><div class="legend-dot" style="background:#4A90D9"></div> Initiative</div>
    <div class="legend-item"><div class="legend-dot" style="background:#50B86C"></div> Project</div>
    <div class="legend-item"><div class="legend-dot" style="background:#AAAAAA"></div> Idea</div>
    <div class="hint">
      Click nodes to collapse/expand<br>
      Full opacity = active &middot; Faded = other<br>
      Scroll to zoom &middot; Drag to pan
    </div>
  </div>

  <div class="panel controls">
    <strong>Filter</strong>
    <label><input type="checkbox" data-type="initiative" checked> Initiatives</label>
    <label><input type="checkbox" data-type="project" checked> Projects</label>
    <label><input type="checkbox" data-type="idea"> Ideas</label>
  </div>

  <div class="tooltip" id="tooltip"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="index.js"></script>
<script>
const COLOR = { initiative: "#4A90D9", project: "#50B86C", idea: "#AAAAAA", root: "#666" };
const RADIUS = { initiative: 8, project: 6, idea: 5, root: 10 };
const NODE_HEIGHT = 28;
const MARGIN = { top: 40, right: 200, bottom: 40, left: 80 };

const allEntries = PORTFOLIO_DATA;
renderFiltered(allEntries);

document.querySelectorAll(".controls input").forEach(cb => {
  cb.addEventListener("change", () => renderFiltered(allEntries));
});

function renderFiltered(allEntries) {
  const activeTypes = new Set();
  document.querySelectorAll(".controls input:checked").forEach(c => activeTypes.add(c.dataset.type));
  const typeFiltered = allEntries.filter(e => activeTypes.has(e.type));
  const slugsNeeded = new Set(typeFiltered.map(e => e.slug));
  const bySlug = new Map(allEntries.map(e => [e.slug, e]));
  for (const e of typeFiltered) {
    let cur = e;
    while (cur.parent && bySlug.has(cur.parent) && !slugsNeeded.has(cur.parent)) {
      slugsNeeded.add(cur.parent);
      cur = bySlug.get(cur.parent);
    }
  }
  const filtered = allEntries.filter(e => slugsNeeded.has(e.slug));
  d3.select("svg").selectAll("*").remove();
  render(filtered);
}

function buildTree(entries) {
  const bySlug = new Map(entries.map(e => [e.slug, e]));
  const childrenMap = new Map();

  for (const e of entries) {
    if (e.parent && bySlug.has(e.parent)) {
      if (!childrenMap.has(e.parent)) childrenMap.set(e.parent, []);
      childrenMap.get(e.parent).push(e);
    }
  }

  const roots = entries.filter(e => !e.parent || !bySlug.has(e.parent));

  function toNode(entry) {
    const kids = childrenMap.get(entry.slug) || [];
    const node = {
      name: entry.title || entry.slug,
      data: entry,
    };
    if (kids.length) {
      node.children = kids
        .sort((a, b) => (a.title || a.slug).localeCompare(b.title || b.slug))
        .map(toNode);
    }
    return node;
  }

  roots.sort((a, b) => {
    const aKids = (childrenMap.get(a.slug) || []).length;
    const bKids = (childrenMap.get(b.slug) || []).length;
    if (bKids !== aKids) return bKids - aKids;
    return (a.title || a.slug).localeCompare(b.title || b.slug);
  });

  return {
    name: "Portfolio",
    data: { type: "root", status: "active", slug: "_root" },
    children: roots.map(toNode),
  };
}

function render(entries) {
  const treeData = buildTree(entries);
  const root = d3.hierarchy(treeData);

  const svg = d3.select("svg");
  const container = document.getElementById("container");
  const tooltip = document.getElementById("tooltip");
  const width = container.clientWidth;
  const height = container.clientHeight;

  const g = svg.append("g")
    .attr("transform", `translate(${MARGIN.left},${MARGIN.top})`);

  svg.call(
    d3.zoom()
      .scaleExtent([0.2, 4])
      .on("zoom", (e) => g.attr("transform", e.transform))
  );

  const initialTransform = d3.zoomIdentity.translate(MARGIN.left, MARGIN.top);
  svg.call(d3.zoom().transform, initialTransform);

  const treeLayout = d3.tree().nodeSize([NODE_HEIGHT, 220]);

  root.descendants().forEach(d => {
    if (d.children && d.children.length) {
      d._children = d.children;
    }
  });

  function update(source) {
    treeLayout(root);

    const duration = 400;

    root.descendants().forEach(d => {
      d.y = d.depth * 250;
    });

    const nodes = g.selectAll("g.node")
      .data(root.descendants(), d => d.data.data.slug + d.depth);

    const nodeEnter = nodes.enter().append("g")
      .attr("class", "node")
      .attr("transform", `translate(${source.y0 || 0},${source.x0 || 0})`)
      .style("cursor", "pointer");

    nodeEnter.append("circle")
      .attr("r", 0);

    nodeEnter.append("text")
      .attr("dy", "0.35em")
      .attr("x", d => d.children || d._children ? -14 : 14)
      .attr("text-anchor", d => d.children || d._children ? "end" : "start")
      .text(d => d.data.name)
      .style("fill-opacity", 0);

    const nodeUpdate = nodeEnter.merge(nodes);

    nodeUpdate.transition().duration(duration)
      .attr("transform", d => `translate(${d.y},${d.x})`);

    nodeUpdate.select("circle")
      .transition().duration(duration)
      .attr("r", d => RADIUS[d.data.data.type] || 6)
      .attr("fill", d => {
        if (d._children && !d.children) return "#fff";
        return COLOR[d.data.data.type] || "#666";
      })
      .attr("stroke", d => COLOR[d.data.data.type] || "#666")
      .attr("stroke-width", 2)
      .attr("opacity", d => d.data.data.status === "active" ? 1.0 : 0.4);

    nodeUpdate.select("text")
      .transition().duration(duration)
      .style("fill-opacity", 1)
      .attr("x", d => d.children || d._children ? -14 : 14)
      .attr("text-anchor", d => d.children || d._children ? "end" : "start");

    const nodeExit = nodes.exit().transition().duration(duration)
      .attr("transform", `translate(${source.y},${source.x})`)
      .remove();

    nodeExit.select("circle").attr("r", 0);
    nodeExit.select("text").style("fill-opacity", 0);

    const links = g.selectAll("path.link")
      .data(root.links(), d => d.target.data.data.slug + d.target.depth);

    const linkEnter = links.enter().insert("path", "g")
      .attr("class", "link")
      .attr("d", () => {
        const o = { x: source.x0 || 0, y: source.y0 || 0 };
        return linkPath({ source: o, target: o });
      });

    linkEnter.merge(links).transition().duration(duration)
      .attr("d", linkPath);

    links.exit().transition().duration(duration)
      .attr("d", () => {
        const o = { x: source.x, y: source.y };
        return linkPath({ source: o, target: o });
      })
      .remove();

    root.descendants().forEach(d => {
      d.x0 = d.x;
      d.y0 = d.y;
    });
  }

  function linkPath(d) {
    return `M${d.source.y},${d.source.x}
            C${(d.source.y + d.target.y) / 2},${d.source.x}
             ${(d.source.y + d.target.y) / 2},${d.target.x}
             ${d.target.y},${d.target.x}`;
  }

  function attachBehaviors() {
    g.selectAll("g.node")
      .on("click", (event, d) => {
        if (!d._children) return;
        if (d.children) {
          d.children = null;
        } else {
          d.children = d._children;
        }
        update(d);
        attachBehaviors();
      })
      .on("mouseover", (event, d) => {
        const data = d.data.data;
        if (data.type === "root") return;
        const color = COLOR[data.type];
        let html = `<span class="badge" style="background:${color}">${data.type}</span>`;
        html += `<h4>${d.data.name}</h4>`;
        if (data.description) html += `<div class="desc">${data.description}</div>`;
        if (data.tags && data.tags.length) html += `<div class="meta">#${data.tags.join(" #")}</div>`;
        html += `<div class="meta">Status: ${data.status || "unknown"}</div>`;
        tooltip.innerHTML = html;
        tooltip.style.display = "block";
      })
      .on("mousemove", (event) => {
        tooltip.style.left = (event.pageX + 14) + "px";
        tooltip.style.top = (event.pageY - 14) + "px";
      })
      .on("mouseout", () => {
        tooltip.style.display = "none";
      });
  }

  update(root);
  attachBehaviors();
}
</script>
</body>
</html>
