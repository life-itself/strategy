<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategic Landscape – Life Itself</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fafafa; padding: 24px 32px; color: #333;
  }

  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }

  .controls {
    display: flex; gap: 12px; align-items: center; margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: #555; display: flex; align-items: center; gap: 6px; }
  .controls input[type=checkbox] { cursor: pointer; }

  .section { margin-bottom: 36px; }
  .section-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 2px solid #eee;
  }
  .section-title { font-size: 16px; font-weight: 600; }
  .section-count {
    font-size: 12px; color: #888; background: #f0f0f0;
    padding: 2px 8px; border-radius: 10px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .card {
    background: #fff; border: 1px solid #e8e8e8;
    border-radius: 8px; padding: 14px 16px;
    border-left: 4px solid #ddd;
  }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .card-parent {
    font-size: 11px; color: #999; text-transform: uppercase;
    letter-spacing: 0.4px; margin-bottom: 8px;
  }
  .card-desc { font-size: 12px; color: #555; line-height: 1.5; }
  .card-type {
    display: inline-block; margin-top: 8px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px;
    color: #aaa; border: 1px solid #eee; padding: 1px 6px; border-radius: 3px;
  }

  /* Status colours */
  .s-active  .card { border-left-color: #4caf50; }
  .s-maintenance .card { border-left-color: #2196f3; }
  .s-paused  .card { border-left-color: #ff9800; }
  .s-idea    .card { border-left-color: #9c27b0; }
  .s-archived .card { border-left-color: #bbb; }

  .s-active    .section-title { color: #2e7d32; }
  .s-maintenance .section-title { color: #1565c0; }
  .s-paused    .section-title { color: #e65100; }
  .s-idea      .section-title { color: #6a1b9a; }
  .s-archived  .section-title { color: #888; }

  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .s-active    .dot { background: #4caf50; }
  .s-maintenance .dot { background: #2196f3; }
  .s-paused    .dot { background: #ff9800; }
  .s-idea      .dot { background: #9c27b0; }
  .s-archived  .dot { background: #bbb; }

  .empty { font-size: 13px; color: #bbb; font-style: italic; padding: 8px 0; }

  @media print {
    body { padding: 16px; background: #fff; }
    .controls { display: none; }
    .card:hover { box-shadow: none; }
  }
</style>
</head>
<body>

<h1>Strategic Landscape</h1>
<p class="subtitle">Life Itself initiatives grouped by status — <span id="ts"></span></p>

<div class="controls">
  <label><input type="checkbox" id="showProjects"> Show projects</label>
  <label><input type="checkbox" id="showArchived"> Show archived</label>
</div>

<div id="app"></div>

<script src="index.js"></script>
<script>
const STATUS_ORDER = ['active', 'maintenance', 'paused', 'idea', 'archived'];
const STATUS_LABELS = {
  active:      'Active',
  maintenance: 'Maintenance',
  paused:      'Paused',
  idea:        'Ideas',
  archived:    'Archived',
};

// Build parent title lookup
const titleOf = {};
PORTFOLIO_DATA.forEach(d => { titleOf[d.slug] = d.title; });

function render() {
  const showProjects = document.getElementById('showProjects').checked;
  const showArchived = document.getElementById('showArchived').checked;

  const items = PORTFOLIO_DATA.filter(d => {
    if (!showProjects && d.type !== 'initiative') return false;
    if (!showArchived && d.status === 'archived') return false;
    return true;
  });

  const byStatus = {};
  STATUS_ORDER.forEach(s => byStatus[s] = []);
  items.forEach(d => {
    const s = d.status || 'unknown';
    if (byStatus[s]) byStatus[s].push(d);
  });

  const app = document.getElementById('app');
  app.innerHTML = '';

  STATUS_ORDER.forEach(s => {
    if (s === 'archived' && !showArchived) return;
    const group = byStatus[s];

    const section = document.createElement('div');
    section.className = `section s-${s}`;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <div class="dot"></div>
      <span class="section-title">${STATUS_LABELS[s]}</span>
      <span class="section-count">${group.length}</span>
    `;
    section.appendChild(header);

    if (group.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing here';
      section.appendChild(empty);
    } else {
      const cards = document.createElement('div');
      cards.className = 'cards';
      group
        .sort((a, b) => a.title.localeCompare(b.title))
        .forEach(d => {
          const card = document.createElement('div');
          card.className = 'card';
          const parentLabel = d.parent ? (titleOf[d.parent] || d.parent) : '';
          card.innerHTML = `
            <div class="card-title">${d.title}</div>
            ${parentLabel ? `<div class="card-parent">${parentLabel}</div>` : ''}
            ${d.description ? `<div class="card-desc">${d.description}</div>` : ''}
            <span class="card-type">${d.type}</span>
          `;
          cards.appendChild(card);
        });
      section.appendChild(cards);
    }

    app.appendChild(section);
  });
}

document.getElementById('showProjects').addEventListener('change', render);
document.getElementById('showArchived').addEventListener('change', render);

document.getElementById('ts').textContent = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});

render();
</script>
</body>
</html>
