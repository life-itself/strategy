<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio – Indented Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fafafa; padding: 24px; color: #333;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 16px; }

  .tree { max-width: 900px; }

  .tree-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px solid #f0f0f0;
    cursor: default; position: relative;
  }
  .tree-row:hover { background: #f5f8ff; }
  .tree-row.has-children { cursor: pointer; }

  .indent { flex-shrink: 0; }
  .toggle {
    width: 16px; height: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #999; user-select: none;
  }
  .dot { flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%; }

  .name { font-size: 13px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .type-label {
    flex-shrink: 0; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.3px; color: #bbb; width: 60px;
  }
  .status-badge {
    flex-shrink: 0; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.3px; padding: 1px 6px; border-radius: 3px;
  }

  /* Status colours — used on dot, badge, and legend */
  .s-active      { background: #e8f5e9; color: #2e7d32; }
  .s-maintenance { background: #e3f2fd; color: #1565c0; }
  .s-paused      { background: #fff3e0; color: #e65100; }
  .s-idea        { background: #f3e5f5; color: #6a1b9a; }
  .s-archived    { background: #f0f0f0; color: #888; }

  .legend-bar {
    display: flex; gap: 20px; flex-wrap: wrap;
    align-items: center; margin-bottom: 12px; font-size: 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
  }
  .legend-item.off { opacity: 0.35; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-count { font-size: 11px; color: #999; }

  .dot-active      { background: #4caf50; }
  .dot-maintenance { background: #2196f3; }
  .dot-paused      { background: #ff9800; }
  .dot-idea        { background: #9c27b0; }
  .dot-archived    { background: #bbb; }
</style>
</head>
<body>

<h1>Portfolio – Indented Tree</h1>
<p class="subtitle">Coloured by status. Click rows with children to collapse/expand. Click legend to toggle status.</p>

<div class="legend-bar" id="legend"></div>
<div class="tree" id="tree"></div>

<script src="index.js"></script>
<script>
const STATUSES = ['active', 'maintenance', 'paused', 'idea', 'archived'];
const STATUS_LABEL = { active: 'Active', maintenance: 'Maintenance', paused: 'Paused', idea: 'Idea', archived: 'Archived' };

const hiddenStatuses = new Set();

// Count per status (initiatives only for the legend counts)
const counts = {};
STATUSES.forEach(s => counts[s] = PORTFOLIO_DATA.filter(d => d.status === s).length);

// Build legend with toggle
const legendEl = document.getElementById('legend');
STATUSES.forEach(s => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.id = 'leg-' + s;
  item.innerHTML = `<div class="legend-dot dot-${s}"></div> ${STATUS_LABEL[s]} <span class="legend-count">${counts[s]}</span>`;
  item.addEventListener('click', () => {
    if (hiddenStatuses.has(s)) hiddenStatuses.delete(s);
    else hiddenStatuses.add(s);
    item.classList.toggle('off', hiddenStatuses.has(s));
    draw();
  });
  legendEl.appendChild(item);
});

function buildTree(entries) {
  const bySlug = new Map(entries.map(e => [e.slug, e]));
  const childrenMap = new Map();
  for (const e of entries) {
    if (e.parent && bySlug.has(e.parent)) {
      if (!childrenMap.has(e.parent)) childrenMap.set(e.parent, []);
      childrenMap.get(e.parent).push(e);
    }
  }
  const roots = entries.filter(e => !e.parent || !bySlug.has(e.parent));
  function toNode(entry, depth) {
    const kids = (childrenMap.get(entry.slug) || [])
      .sort((a, b) => (a.title || a.slug).localeCompare(b.title || b.slug));
    return { entry, depth, children: kids.map(k => toNode(k, depth + 1)) };
  }
  roots.sort((a, b) => {
    const aK = (childrenMap.get(a.slug) || []).length;
    const bK = (childrenMap.get(b.slug) || []).length;
    return bK !== aK ? bK - aK : (a.title || a.slug).localeCompare(b.title || b.slug);
  });
  return roots.map(r => toNode(r, 0));
}

const tree = buildTree(PORTFOLIO_DATA);
const collapsed = new Set();
const container = document.getElementById('tree');

function isVisible(node) {
  return !hiddenStatuses.has(node.entry.status || '');
}

function draw() {
  container.innerHTML = '';
  const flat = [];
  function flatten(nodes) {
    for (const node of nodes) {
      if (!isVisible(node)) continue;
      flat.push(node);
      if (node.children.length && !collapsed.has(node.entry.slug)) flatten(node.children);
    }
  }
  flatten(tree);

  for (const node of flat) {
    const e = node.entry;
    const visibleKids = node.children.filter(isVisible);
    const hasKids = visibleKids.length > 0;
    const isCollapsed = collapsed.has(e.slug);

    const row = document.createElement('div');
    row.className = 'tree-row' + (hasKids ? ' has-children' : '');

    const indent = document.createElement('div');
    indent.className = 'indent';
    indent.style.width = (node.depth * 24) + 'px';
    row.appendChild(indent);

    const toggle = document.createElement('div');
    toggle.className = 'toggle';
    if (hasKids) toggle.textContent = isCollapsed ? '▶' : '▼';
    row.appendChild(toggle);

    const dot = document.createElement('div');
    dot.className = `dot dot-${e.status || 'archived'}`;
    row.appendChild(dot);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = e.title || e.slug;
    row.appendChild(name);

    const typeLabel = document.createElement('div');
    typeLabel.className = 'type-label';
    typeLabel.textContent = e.type;
    row.appendChild(typeLabel);

    if (e.status) {
      const badge = document.createElement('span');
      badge.className = `status-badge s-${e.status}`;
      badge.textContent = STATUS_LABEL[e.status] || e.status;
      row.appendChild(badge);
    }

    if (hasKids) {
      row.addEventListener('click', () => {
        collapsed.has(e.slug) ? collapsed.delete(e.slug) : collapsed.add(e.slug);
        draw();
      });
    }

    container.appendChild(row);
  }
}

draw();
</script>
</body>
</html>
